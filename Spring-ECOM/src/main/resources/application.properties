# Optional machine-local overrides are excluded from Git.
spring.config.import=optional:file:./application-local.properties
spring.application.name=Spring-ECOM
server.port=${SERVER_PORT:8081}

# Supply credentials with environment variables or application-local.properties.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sanjay}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# PostgreSQL large objects require a transaction when reading product images.
spring.datasource.hikari.auto-commit=false
