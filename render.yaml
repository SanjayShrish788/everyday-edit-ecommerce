services:
  - type: web
    name: everyday-edit-api
    runtime: docker
    plan: free
    region: singapore
    branch: deployment/production
    dockerContext: ./Spring-ECOM
    dockerfilePath: ./Spring-ECOM/Dockerfile
    healthCheckPath: /actuator/health
    autoDeployTrigger: off
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
